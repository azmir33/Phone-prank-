<!DOCTYPE html>
<html>
<head>
    <title>Security Alert</title>
    <style>
        body {
            margin: 0;
            background: #050505;
            color: #00ff41;
            font-family: monospace;
            text-align: center;
            padding-top: 80px;
        }

        .warning {
            color: red;
            font-size: 32px;
            font-weight: bold;
        }

        #progress {
            width: 80%;
            height: 25px;
            border: 2px solid #00ff41;
            margin: 30px auto;
        }

        #bar {
            width: 0%;
            height: 100%;
            background: #00ff41;
        }

        #status {
            font-size: 20px;
        }

        #prank {
            display: none;
            color: white;
            font-family: Arial;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div id="fake">

        <div class="warning">⚠ SECURITY ALERT ⚠</div>

        <h2>Unauthorized Access Detected</h2>

        <p id="status">Scanning device...</p>

        <div id="progress">
            <div id="bar"></div>
        </div>

        <p id="percent">0%</p>

    </div>

    <div id="prank">
        <h1>😂 GOT YOU! 😂</h1>
        <h2>Your phone is completely safe.</h2>
        <p>This was only a prank website.</p>
        <button onclick="location.reload()">Try Again 😈</button>
    </div>

    <script>
        let progress = 0;

        let timer = setInterval(function () {

            progress++;

            document.getElementById("bar").style.width =
                progress + "%";

            document.getElementById("percent").innerText =
                progress + "%";

            if (progress == 30) {
                document.getElementById("status").innerText =
                    "Checking files...";
            }

            if (progress == 60) {
                document.getElementById("status").innerText =
                    "Checking security...";
            }

            if (progress == 85) {
                document.getElementById("status").innerText =
                    "Final security scan...";
            }

            if (progress >= 100) {

                clearInterval(timer);

                setTimeout(function () {

                    document.getElementById("fake").style.display =
                        "none";

                    document.getElementById("prank").style.display =
                        "block";

                }, 1000);
            }

        }, 50);
    </script>

</body>
</html>
